<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Fossil Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importing a sci-fi/tech thematic font for the excavation vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Mono', monospace;
            background-color: #050505; /* Deep dark background */
        }
        
        /* Subtle blinking animation for the underscore to make it feel like an active terminal */
        .blinking-cursor {
            animation: blink 1s step-start infinite;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col justify-center items-center px-6 text-center antialiased">

    <!-- Green Header -->

    <div class="text-6xl md:text-8xl font-bold text-gray-300 mb-8 blinking-cursor select-none">
         <h1 class="text-2xl md:text-4xl lg:text-5xl font-bold text-green-500 mb-6 uppercase tracking-widest leading-snug shadow-green-500/20 drop-shadow-lg">
        Active Excavation<br class="md:hidden"> in Progress
    </h1>
    </div>

    <!-- Logo -->
    <img src="images/AlienFossil_WORDS.png" alt="Alien Fossil Logo" style="display: block; margin: 75; width: 50vw; height: auto;">
    <!-- White Subheader -->
    <p class="text-base md:text-lg lg:text-xl text-white font-light tracking-wide opacity-90">
        Check For Updates Coming Soon!
    </p>

</body>
</html>
